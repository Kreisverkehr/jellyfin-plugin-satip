overview: "A SAT>IP server client plugin for Jellyfin."
description: "This plugin provides a tuner for your SAT>IP server. It supports automatic discovery of your tuners and scanning for epg data."
category: "Live TV"
owner: "Kreisverkehr"

artifacts:
  - "Kreisverkehr.SatIp.dll"
  - "Kreisverkehr.SatIp.deps.json"
  - "Kreisverkehr.NetSsdp.dll"
  - "Kreisverkehr.NetUpnp.dll"
  - "Kreisverkehr.TsDecoder.dll"

changelog: |
  - fix: prevent EPG scans from running indefinitely
  - feat: use the custom DVB metadata decoder for EPG scanning
  - feat: scan EPG data per multiplex
  - chore: align the assembly name and update dependencies
  - note: plugin configuration may be lost during an update
