
name: Build and publish plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          META_VERSION="$(sed -n \
            's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' \
            .github/jprm.yaml | head -n1)"

          if [[ "$VERSION" != "$META_VERSION" ]]; then
            echo "::error::Tag version $VERSION differs from build.yaml version $META_VERSION"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          dotnet restore SatIp.slnx
          dotnet build SatIp.slnx \
            --configuration Release \
            --no-restore \
            -p:Version="${{ steps.version.outputs.value }}"
          dotnet publish SatIp.slnx \
            --configuration Release \
            --no-build \
            -p:Version="${{ steps.version.outputs.value }}"

      - name: Install JPRM
        run: |
          python -m pip install --upgrade pip
          python -m pip install jprm

      - name: Package plugin
        run: |
          mkdir -p artifacts
          jprm plugin build . \
            --output artifacts \
            --version "${{ steps.version.outputs.value }}"

      - name: Locate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -maxdepth 1 -type f -name '*.zip')
          if [[ "${#FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one plugin ZIP"
            exit 1
          fi
          echo "path=${FILES[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${FILES[0]}")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.path }}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Notify central catalog
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          CATALOG_REPO: kreisverkehr/jellyfin-plugins
          PLUGIN_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ steps.package.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/${PLUGIN_REPO}/releases/download/${TAG}/${ASSET_NAME}"

          jq -n \
            --arg repo "$PLUGIN_REPO" \
            --arg tag "$TAG" \
            --arg url "$URL" \
            '{event_type:"plugin-release-published",
              client_payload:{plugin_repo:$repo,tag:$tag,download_url:$url}}' \
            > payload.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CATALOG_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CATALOG_REPO}/dispatches" \
            -d @payload.json
